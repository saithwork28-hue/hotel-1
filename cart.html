<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Your cart · Tasteo</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><link rel="icon" href="favicon.ico" sizes="48x48"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>
.notice{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px 16px;border:1px solid #f5dcc3;background:#fff8f0;border-radius:14px}
.notice svg{flex:0 0 20px;margin-top:2px;color:#e8472b}
.notice b{display:block;font-size:14px;font-weight:700;color:#1c1c1c;letter-spacing:.1px}
.notice span{display:block;font-size:13px;line-height:1.5;color:#6b5648;font-weight:400}

/* Suggestions */
.sug{margin-top:18px}
.sug h2{font-size:16px;font-weight:700;margin:0 0 10px;color:#1c1c1c}
.sug-row{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.sug-card{flex:0 0 150px;scroll-snap-align:start;border:1px solid #f0e2d6;background:#fff;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.sug-card img{width:100%;height:90px;object-fit:cover;background:#fbeee3;display:block}
.sug-body{padding:10px;display:flex;flex-direction:column;gap:2px;flex:1}
.sug-body b{font-size:13.5px;font-weight:700;color:#1c1c1c;line-height:1.3}
.sug-body span{font-size:13px;color:#6b5648}
.sug-add{margin-top:8px;padding:7px 0;border:1.5px solid #e8472b;color:#e8472b;background:#fff;border-radius:999px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.sug-add:hover{background:#e8472b;color:#fff}
.sug-add:focus-visible{outline:2px solid #e8472b;outline-offset:2px}
</style></head><body>
<header><a class="logo" href="index.html">Anwar Foods</a><a href="index.html">Home</a><a href="cart.html">Cart</a><a href="track.html">Track order</a><a href="login.html">Account</a></header>
<main><h1>Your cart</h1><div id="box"></div></main>
<script src="shared.js"></script>
<script>
let signedIn=null;

/* ---------------------------------------------------------------
   SUGGESTION MENU
   IMPORTANT: the "id" values must match the ids your real menu uses
   (the same ids that go into getCart()), otherwise the same dish
   can show up twice in the cart. Replace names/prices/images with
   your own menu items.
   cat: main | side | drink | dessert
---------------------------------------------------------------- */
const SUGGEST=[
 {id:"garlic-bread",n:"Garlic Bread",p:99,cat:"side",img:"images/garlic-bread.jpg"},
 {id:"french-fries",n:"French Fries",p:89,cat:"side",img:"images/fries.jpg"},
 {id:"chicken-wings",n:"Chicken Wings",p:149,cat:"side",img:"images/wings.jpg"},
 {id:"cold-coffee",n:"Cold Coffee",p:79,cat:"drink",img:"images/cold-coffee.jpg"},
 {id:"fresh-lime",n:"Fresh Lime Soda",p:49,cat:"drink",img:"images/lime-soda.jpg"},
 {id:"coke",n:"Coke (500ml)",p:45,cat:"drink",img:"images/coke.jpg"},
 {id:"brownie",n:"Chocolate Brownie",p:119,cat:"dessert",img:"images/brownie.jpg"},
 {id:"gulab-jamun",n:"Gulab Jamun",p:69,cat:"dessert",img:"images/gulab-jamun.jpg"},
 {id:"chicken-biryani",n:"Chicken Biryani",p:199,cat:"main",img:"images/biryani.jpg"},
 {id:"margherita-pizza",n:"Margherita Pizza",p:229,cat:"main",img:"images/pizza.jpg"}
];

/* Pick up to 6 items the customer doesn't have yet.
   Categories missing from the cart (drink, dessert, side) come first. */
function suggestions(c){
 const inCart=new Set(Object.keys(c));
 const have=new Set();
 Object.keys(c).forEach(id=>{const m=SUGGEST.find(s=>s.id===id);have.add(m?m.cat:"main")});
 const pool=SUGGEST.filter(s=>!inCart.has(s.id)&&s.cat!=="main");
 const order=["drink","dessert","side"];
 const missing=order.filter(k=>!have.has(k));
 const rank=s=>missing.includes(s.cat)?0:1;
 return pool.sort((a,b)=>rank(a)-rank(b)).slice(0,6);
}

function sugHTML(c){
 const list=suggestions(c);
 if(!list.length)return"";
 return `<section class="sug" aria-label="Suggestions"><h2>You might also like</h2><div class="sug-row">`+
 list.map(s=>`<div class="sug-card"><img src="${esc(s.img)}" alt="${esc(s.n)}" loading="lazy" onerror="this.style.visibility='hidden'"><div class="sug-body"><b>${esc(s.n)}</b><span>${inr(s.p)}</span><button class="sug-add" data-a="${esc(s.id)}">Add</button></div></div>`).join("")+
 `</div></section>`;
}

const cta=()=>signedIn===null?'<button class="btn" disabled>Checking sign-in...</button>':signedIn?'<a class="btn" href="checkout.html">Proceed to payment</a>':'<div class="notice"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><div><b>Sign in required</b><span>Please sign in to place your order. Your cart will be saved.</span></div></div><a class="btn" href="login.html?next=checkout.html">Sign in to continue</a>';
function draw(){
 const c=getCart(),ids=Object.keys(c);
 if(!ids.length){$("box").innerHTML='<div class="empty">Your cart is empty.<a class="btn" href="index.html">Browse restaurants</a></div>';return}
 const b=bill(c);
 $("box").innerHTML=ids.map(i=>`<div class="item"><div><b>${esc(c[i].n)}</b>${inr(c[i].p*c[i].q)}</div><div class="qty"><button data-m="${i}">−</button>${c[i].q}<button data-p="${i}">+</button></div></div>`).join("")+
 sugHTML(c)+
 `<div style="margin-top:14px"><div class="row"><span>Item total</span><span>${inr(b.s)}</span></div><div class="row"><span>Delivery fee</span><span>${b.d?inr(b.d):"FREE"}</span></div><div class="row"><span>GST and charges</span><span>${inr(b.g)}</span></div><div class="row tot"><span>To pay</span><span>${inr(b.t)}</span></div></div>`+
 `<p class="m">${b.d?"Add "+inr(300-b.s)+" more for free delivery.":"You get free delivery on this order."}</p>`+
 `${cta()}<a class="btn alt" href="index.html">Add more items</a>`}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;const c=getCart(),d=t.dataset;
 if(d.a){
  const s=SUGGEST.find(x=>x.id===d.a);if(!s)return;
  if(c[s.id])c[s.id].q++;else c[s.id]={n:s.n,p:s.p,q:1};
 }
 else if(d.p&&c[d.p])c[d.p].q++;
 else if(d.m&&c[d.m]){c[d.m].q--;if(c[d.m].q<1)delete c[d.m]}
 else return;
 setCart(c);draw()});
draw();
if(sb)sb.auth.getSession().then(r=>{signedIn=!!r.data.session;draw()});else{signedIn=false;draw()}
</script></body></html>
