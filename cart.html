<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Your cart · Tasteo</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><link rel="icon" href="favicon.ico" sizes="48x48"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>
.notice{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px 16px;border:1px solid #f5dcc3;background:#fff8f0;border-radius:14px}
.notice svg{flex:0 0 20px;margin-top:2px;color:#e8472b}
.notice b{display:block;font-size:14px;font-weight:700;color:#1c1c1c;letter-spacing:.1px}
.notice span{display:block;font-size:13px;line-height:1.5;color:#6b5648;font-weight:400}
</style></head><body>
<header><a class="logo" href="index.html">Anwar Foods</a><a href="index.html">Home</a><a href="cart.html">Cart</a><a href="track.html">Track order</a><a href="login.html">Account</a></header>
<main><h1>Your cart</h1><div id="box"></div></main>
<script src="shared.js"></script>
<script>
let signedIn=null;
const cta=()=>signedIn===null?'<button class="btn" disabled>Checking sign-in...</button>':signedIn?'<a class="btn" href="checkout.html">Proceed to payment</a>':'<div class="notice"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><div><b>Sign in required</b><span>Please sign in to place your order. Your cart will be saved.</span></div></div><a class="btn" href="login.html?next=checkout.html">Sign in to continue</a>';
function draw(){
 const c=getCart(),ids=Object.keys(c);
 if(!ids.length){$("box").innerHTML='<div class="empty">Your cart is empty.<a class="btn" href="index.html">Browse restaurants</a></div>';return}
 const b=bill(c);
 $("box").innerHTML=ids.map(i=>`<div class="item"><div><b>${esc(c[i].n)}</b>${inr(c[i].p*c[i].q)}</div><div class="qty"><button data-m="${i}">−</button>${c[i].q}<button data-p="${i}">+</button></div></div>`).join("")+
 `<div style="margin-top:14px"><div class="row"><span>Item total</span><span>${inr(b.s)}</span></div><div class="row"><span>Delivery fee</span><span>${b.d?inr(b.d):"FREE"}</span></div><div class="row"><span>GST and charges</span><span>${inr(b.g)}</span></div><div class="row tot"><span>To pay</span><span>${inr(b.t)}</span></div></div>`+
 `<p class="m">${b.d?"Add "+inr(300-b.s)+" more for free delivery.":"You get free delivery on this order."}</p>`+
 `${cta()}<a class="btn alt" href="index.html">Add more items</a>`}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;const c=getCart(),d=t.dataset;
 if(d.p&&c[d.p])c[d.p].q++;
 else if(d.m&&c[d.m]){c[d.m].q--;if(c[d.m].q<1)delete c[d.m]}
 else return;
 setCart(c);draw()});
draw();
if(sb)sb.auth.getSession().then(r=>{signedIn=!!r.data.session;draw()});else{signedIn=false;draw()}
</script></body></html>
