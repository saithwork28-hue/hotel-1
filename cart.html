<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Your cart · Anwar Foods</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><link rel="icon" href="favicon.ico" sizes="48x48"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>
.notice{display:flex;gap:12px;align-items:flex-start;margin-top:14px;padding:14px 16px;border:1px solid #f5dcc3;background:#fff8f0;border-radius:14px}
.notice svg{flex:0 0 20px;margin-top:2px;color:#e8472b}
.notice b{display:block;font-size:14px;font-weight:700;color:#1c1c1c;letter-spacing:.1px}
.notice span{display:block;font-size:13px;line-height:1.5;color:#6b5648;font-weight:400}
/* "You might also like" */
.sug{margin-top:20px}
.sug h2{font-size:16px;font-weight:700;margin:0 0 10px;color:#1c1c1c;text-align:left;letter-spacing:0}
.sug-row{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 10px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.sug-card{flex:0 0 150px;scroll-snap-align:start;border:1px solid #f0e2d6;background:#fff;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.sug-img{position:relative;height:96px;background:linear-gradient(135deg,#fdeede,#fbe0d2);display:grid;place-items:center;font-size:40px}
.sug-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sug-body{padding:10px;display:flex;flex-direction:column;gap:2px;flex:1}
.sug-body b{font-size:13.5px;font-weight:700;color:#1c1c1c;line-height:1.3}
.sug-body span.pr{font-size:13px;color:#6b5648}
.vg{display:inline-block;width:11px;height:11px;border:1.5px solid #1e8e4f;border-radius:2px;position:relative;margin-right:5px;top:1px}
.vg::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#1e8e4f}
.vg.nv{border-color:#b3261e}.vg.nv::after{background:#b3261e}
.sug-add{margin-top:8px;padding:7px 0;border:1.5px solid #e8472b;color:#e8472b;background:#fff;border-radius:999px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.sug-add:hover{background:#e8472b;color:#fff}
.sug-add:focus-visible{outline:2px solid #e8472b;outline-offset:2px}
</style></head><body>
<header><a class="logo" href="index.html">Anwar Foods</a><a href="index.html">Home</a><a href="cart.html">Cart</a><a href="track.html">Track order</a><a href="login.html">Account</a></header>
<main><h1>Your cart</h1><div id="box"></div></main>
<script src="shared.js"></script>
<script>
let signedIn=null,MENU=[];
/* Photos: same ones the home page uses. A dish without its own photo shows its restaurant's photo. */
const IMGR={1:"images/biriyani.jpg",2:"images/meals.jpg",3:"images/pizza.jpg",4:"images/burger.jpg",5:"images/juice.jpg",6:"images/cakes.jpg"};
const IMGD={11:"images/biriyani.jpg",21:"images/meals.jpg",31:"images/pizza.jpg",41:"images/burger.jpg",61:"images/cakes.jpg"};

/* Suggestions come from your real menu in Supabase (same ids as the home page, so checkout works). */
async function loadMenu(){
 if(!sb)return;
 try{const r=await sb.from("menu_items").select("id,restaurant_id,name,price,is_veg,image_url").eq("available",true);
  if(r.data&&r.data.length){MENU=r.data;draw()}}catch(e){}
}
const ADDON=/fries|bread|raita|rings|naan|nuggets|rolls|soup|vada|lollipop|coffee|shake|juice|soda|coke|lime|payasam|cake|brownie|jamun|cupcake|cheesecake|lava|truffle|ice cream|pongal|idli/i;
/* Best picks first: same restaurant as the cart, add-on type items, and affordable ones. */
function suggestions(c){
 const inCart=new Set(Object.keys(c));
 const rs=new Set(MENU.filter(m=>inCart.has(String(m.id))).map(m=>m.restaurant_id));
 return MENU.filter(m=>!inCart.has(String(m.id)))
  .map(m=>({m,s:(rs.has(m.restaurant_id)?3:0)+(ADDON.test(m.name)?2:0)+(m.price<=150?1:0)}))
  .sort((a,b)=>b.s-a.s||a.m.price-b.m.price).slice(0,8).map(x=>x.m);
}
/* No matching photo? Show a clean food emoji tile instead of a wrong picture. */
const EMO=[[/coffee|tea/i,"☕"],[/shake|juice|soda|coke|lime/i,"🥤"],[/ice cream/i,"🍨"],[/cake|brownie|cupcake|cheesecake|lava|truffle/i,"🍰"],[/jamun|payasam/i,"🍮"],[/fries/i,"🍟"],[/bread|naan/i,"🥖"],[/raita/i,"🥣"],[/soup/i,"🍲"],[/roll/i,"🌯"],[/burger/i,"🍔"],[/pizza/i,"🍕"],[/biryani|rice|meals/i,"🍛"],[/noodle/i,"🍜"],[/pasta/i,"🍝"],[/dosa|idli|vada|pongal/i,"🥞"],[/chicken|lollipop|nugget|wing|65/i,"🍗"],[/paneer|chilli/i,"🧀"]];
const emo=n=>(EMO.find(x=>x[0].test(n))||[0,"🍽️"])[1];
function sugHTML(c){
 const list=suggestions(c);if(!list.length)return"";
 return '<section class="sug" aria-label="Suggestions"><h2>Add more to your order</h2><div class="sug-row">'+
 list.map(m=>{const src=m.image_url||IMGD[m.id]||`images/dishes/${m.id}.jpg`;
  return `<div class="sug-card"><div class="sug-img"><span>${emo(m.name)}</span><img src="${esc(src)}" alt="${esc(m.name)}" loading="lazy" onerror="this.remove()"></div><div class="sug-body"><b><span class="vg ${m.is_veg?"":"nv"}"></span>${esc(m.name)}</b><span class="pr">${inr(m.price)}</span><button class="sug-add" data-a="${esc(m.id)}">Add</button></div></div>`}).join("")+
 '</div></section>';
}

const cta=()=>signedIn===null?'<button class="btn" disabled>Checking sign-in...</button>':signedIn?'<a class="btn" href="checkout.html">Proceed to payment</a>':'<div class="notice"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><div><b>Sign in required</b><span>Please sign in to place your order. Your cart will be saved.</span></div></div><a class="btn" href="login.html?next=checkout.html">Sign in to continue</a>';
function draw(){
 const c=getCart(),ids=Object.keys(c);
 if(!ids.length){$("box").innerHTML='<div class="empty">Your cart is empty.<a class="btn" href="index.html">Browse restaurants</a></div>';return}
 const b=bill(c);
 $("box").innerHTML=ids.map(i=>`<div class="item"><div><b>${esc(c[i].n)}</b>${inr(c[i].p*c[i].q)}</div><div class="qty"><button data-m="${i}">−</button>${c[i].q}<button data-p="${i}">+</button></div></div>`).join("")+
 sugHTML(c)+
 `<div style="margin-top:14px"><div class="row"><span>Item total</span><span>${inr(b.s)}</span></div><div class="row"><span>Delivery fee</span><span>${b.d?inr(b.d):"FREE"}</span></div><div class="row"><span>GST and charges</span><span>${inr(b.g)}</span></div><div class="row tot"><span>To pay</span><span>${inr(b.t)}</span></div></div>`+
 `<p class="m">${b.d?"Add "+inr(300-b.s)+" more for free delivery.":"You get free delivery on this order."}</p>`+
 `${cta()}<a class="btn alt" href="index.html">Add more items</a>`}
document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;const c=getCart(),d=t.dataset;
 if(d.a){const m=MENU.find(x=>String(x.id)===d.a);if(!m)return;
  if(c[m.id])c[m.id].q++;else c[m.id]={n:m.name,p:m.price,q:1}}
 else if(d.p&&c[d.p])c[d.p].q++;
 else if(d.m&&c[d.m]){c[d.m].q--;if(c[d.m].q<1)delete c[d.m]}
 else return;
 setCart(c);draw()});
draw();loadMenu();
if(sb)sb.auth.getSession().then(r=>{signedIn=!!r.data.session;draw()});else{signedIn=false;draw()}
</script></body></html>
